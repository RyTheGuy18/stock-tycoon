# Sends Stock Tycoon push notifications (see push/worker.js).
# Each run is a ~105-minute shift. A new run is queued every hour and waits for the current one to finish,
# so there's always a worker on duty. GitHub Actions minutes are free for public repos.
name: Push worker
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
concurrency:
  group: push-worker
  cancel-in-progress: false
jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci --omit=dev
        working-directory: push
      - run: node worker.js
        working-directory: push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          RUN_MINUTES: "105"
          CHROME: /usr/bin/google-chrome
