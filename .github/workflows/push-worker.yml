# Sends Stock Tycoon push notifications (see push/worker.js).
# Each run is a ~105-minute shift. At the end of every shift the run starts the next one itself (workflow_dispatch),
# so a worker is always on duty. The hourly schedule is only a backup in case the chain ever breaks: GitHub's
# scheduled runs are often delayed or skipped, so they can't be relied on alone.
# GitHub Actions minutes are free for public repos.
name: Push worker
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
concurrency:
  group: push-worker
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci --omit=dev
        working-directory: push
      - run: node worker.js
        working-directory: push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          RUN_MINUTES: "105"
          CHROME: /usr/bin/google-chrome
      # hand over to the next shift (runs even if this shift crashed)
      - name: Start the next shift
        if: always()
        run: gh workflow run push-worker.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
