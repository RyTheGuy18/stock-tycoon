<style>
:root{--bg:#07090c;--panel:#0e1319;--card:#121922;--c2:#18212c;--line:#1f2a36;--text:#e8eef4;--mut:#77879a;--up:#16c784;--dn:#ea3943;--gold:#f5b301;--pur:#a855f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{background:var(--panel)} html,body{margin:0;height:100%;overscroll-behavior:none} body{position:relative;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button,input{font:inherit;color:inherit;border:0}
button{cursor:pointer;background:none}
input{user-select:text;-webkit-user-select:text}
.m{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;position:absolute;top:0;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--bg)}

.l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.hv{font-size:21px;font-weight:800;white-space:nowrap;letter-spacing:-.02em}
#cash{font-size:30px;color:var(--gold)} #cash.neg{color:var(--dn)}
#home{font-size:11.5px;color:var(--mut);margin-top:3px}
#debt{display:none;background:#3a1014;border:1px solid #6b1d24;color:#ffb4ba;font-size:12px;padding:6px 9px;border-radius:9px;margin-top:6px}
main{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain;position:relative}
#ptr{position:absolute;left:50%;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;z-index:5;opacity:0;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}

html.pwa header{padding-top:calc(env(safe-area-inset-top) + 32px)} html.pwa #hbtns{top:calc(env(safe-area-inset-top) + 30px)}

nav button.on{color:var(--text)} nav button.on span{opacity:1;color:var(--gold)} nav button.on{color:var(--text)}
#chips{display:flex;gap:5px;overflow-x:auto;padding:8px 10px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 8px;text-align:left}
.chip b{display:block;font:700 12px "JetBrains Mono"} .chip small{font:11px "JetBrains Mono"}
.d1{display:inline-flex;align-items:center;gap:2px;font-family:"JetBrains Mono",monospace} .d1 svg{display:block} #qc .d1{font-size:15px;gap:4px} #qc .d1 svg{width:11px;height:11px}
.chip .cd1{display:block;font-size:10.5px;margin-top:1px}
.chip.on{border-color:var(--gold);background:#2a2410} .chip.lock{opacity:.4}

.pad{padding:10px 10px 4px}

.gold{background:var(--gold);color:#2a1d00} .ghost{background:var(--c2);border:1px solid var(--line);color:var(--text)}

.btn.taxw{background:#8a5a00;color:#fff} .taxw-t{font-size:11.5px;color:#ffb347;margin-top:3px} .taxw-t b{color:#ff6b74}

.utile2 .icob{width:36px;height:36px;border-radius:11px}

.tiers{display:flex;gap:3px;margin-top:6px} .tiers i{flex:1;height:4px;border-radius:9px;background:var(--c2)}

.spot2 .sl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}

.buybig{width:100%;margin-top:14px;padding:15px 0;font-size:17px;border-radius:12px;background:var(--gold);color:#2a1d00}
.buyul{width:100%;margin-top:8px;background:var(--gold);color:#2a1d00;padding:9px 0}
.utile2{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:0;padding:11px} .utile2.max{border-color:#f5b30155}
.utile2 .t{font-size:11.5px} .nxt{margin-top:2px}
.pips{display:flex;gap:4px;margin:6px 0 5px} .pips i{width:16px;height:5px;border-radius:9px;background:var(--c2)}
.maxb{margin-top:8px;width:100%;text-align:center;font-weight:800;font-size:12px;letter-spacing:.1em;color:#f5b301;background:#f5b3011a;border-radius:9px;padding:9px 0}
.buybig:not(:disabled),.buyul:not(:disabled){animation:canbuy 1.8s ease-in-out infinite}
@keyframes canbuy{0%,100%{box-shadow:0 0 0 0 rgba(245,179,1,0)}50%{box-shadow:0 0 0 4px rgba(245,179,1,.3)}}
.pop{animation:popin .55s cubic-bezier(.2,1.6,.4,1)} @keyframes popin{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.spot{border-color:var(--gold)!important;background:linear-gradient(180deg,#1d1a10,var(--card) 70%)}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px} .kvs>span:nth-child(odd){color:var(--mut)} .kvs>span:nth-child(even){text-align:right}
.utile{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:0;padding:10px} .utile.own{opacity:.6}
.qty{display:flex;gap:5px;margin-bottom:6px}

h3{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:12px 3px 6px;font-weight:600}
.bar{height:6px;background:var(--c2);border-radius:99px;overflow:hidden;margin:6px 0 3px}
.bar i{display:block;height:100%;background:var(--gold)} .bar.f i{background:#f97316}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--c2);color:var(--mut);margin-left:3px}

.optp{display:flex!important;align-items:center;gap:11px} .optp:disabled{opacity:.55}
.opt{display:block;width:100%;text-align:left;background:var(--c2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:6px}
.opt:disabled{opacity:.4}
.inp{width:100%;background:var(--c2);border:1px solid var(--line);border-radius:9px;padding:9px;font-family:"JetBrains Mono"}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.kv div{background:var(--c2);border-radius:8px;padding:6px 8px;font-size:11.5px;color:var(--mut)} .kv b{display:block;font-size:13px;color:var(--text)}
.mom{background:var(--c2);border-left:3px solid var(--gold);border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.45;margin:6px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}

#toast.show{opacity:1} #toast.good{border-color:var(--up);background:#0d2a1e} #toast.bad{border-color:var(--dn);background:#2c1014}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px} .ili{display:inline-flex;vertical-align:-3px;margin-right:4px} .ili svg{display:block}

.fhd{margin-bottom:8px} .ftiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px} .ftiles>div{background:var(--c2);border-radius:9px;padding:8px 10px} .ftiles b{font-size:17px;display:block}
.fsg{margin:4px 0 6px} .fsg button{padding:5px 4px;font-size:12px}

.fkv{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:8px;font-size:12px} .fkv div{display:flex;justify-content:space-between;gap:6px} .fkv span{color:var(--mut)}
#intro{position:fixed;inset:0;z-index:12;background:radial-gradient(120% 90% at 50% 0%,#1b2333,#07090c 70%);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) max(26px,calc(50vw - 300px)) calc(env(safe-area-inset-bottom) + 22px)}

.perk{display:inline-block;font-size:11px;color:#c8a24a;background:#1d1a10;border-radius:6px;padding:1px 6px;margin-top:3px}

#gear{background:none;color:var(--mut);line-height:1;padding:4px;display:flex;align-items:center} #gear svg{width:20px;height:20px;display:block}
header{position:relative}

const CC=new Map(), HSUM=new Map(); let BUDGET=Infinity;
function hsum(i,h){ const key=i+":"+h; let s=HSUM.get(key); if(s) return s; if(performance.now()>BUDGET) return null;
  const c=chunk(i,h), P=c.P, V=c.V, ev=evList(i,h).length>0||nwList(i,h).length>0, b=h*HN; let first=0,last=0,hi=-Infinity,lo=Infinity,v=0;
  for(let t=0;t<HN;t++){ const p=ev?price(i,b+t):P[t]; if(!t) first=p; last=p; if(p>hi)hi=p; if(p<lo)lo=p; v+=ev?volAt(i,b+t):V[t]; }
  s=[first,hi,lo,last,v]; HSUM.set(key,s); if(HSUM.size>40000) HSUM.delete(HSUM.keys().next().value); return s; }
const dayOfs=()=>Math.round(new Date().getTimezoneOffset()/60)*3600; // daily candles start at local midnight
function candles(i,tf,n,now){ const out=[], ofs=tf>=86400?dayOfs():0, last=Math.floor((now-ofs)/tf)*tf+ofs;
  for(let j=0;j<n;j++){ const s0=last-j*tf, e=Math.min(s0+tf-1,now), done=s0+tf-1<now, key=i+":"+tf+":"+s0; // newest first, so recent candles show first
    if(done&&CC.has(key)){ out.unshift(CC.get(key)); continue; }
    let o=null,h=-Infinity,l=Infinity,c=null,v=0,miss=false;
    if(tf>=3600){ const h0=Math.floor(s0/HN), hn=Math.floor(e/HN);
      for(let hh=h0;hh<=hn;hh++){ let s;
        if(hh<hn||done) s=hsum(i,hh);
        else { const b=hh*HN; let p0=pxi(i,b),hi2=p0,lo2=p0,p=p0,vv=0; for(let t2=b;t2<=e;t2++){ p=pxi(i,t2); if(p>hi2)hi2=p; if(p<lo2)lo2=p; vv+=volAt(i,t2); } s=[p0,hi2,lo2,p,vv]; }
        if(!s){ miss=true; break; } if(o===null) o=s[0]; if(s[1]>h)h=s[1]; if(s[2]<l)l=s[2]; c=s[3]; v+=s[4]; } }
    else { o=pxi(i,s0); h=l=c=o; for(let t2=s0;t2<=e;t2++){ const p=pxi(i,t2); if(p>h)h=p; if(p<l)l=p; c=p; v+=volAt(i,t2); } }
    if(miss){ out.unshift([null,null,null,null,0,s0]); continue; }
    const k=[o,h,l,c,v,s0]; if(done){ CC.set(key,k); if(CC.size>20000) CC.delete(CC.keys().next().value); } out.unshift(k); }
  return out; }
function newsSince(t0,t1){ const out=[]; for(let h=Math.floor(t0/HN);h<=Math.floor(t1/HN);h++) SER.forEach((d,i)=>{ if(d.gone) return; const s=sched(i,h);
  s.eps.forEach(e=>{ const at=h*HN+e.st+(e.nwo||0), pa=h*HN+e.st; if(e.nw&&at>t0&&at<=t1) out.push({at,s:d.s,t:e.nw.replace("{n}",d.n)+" ("+d.s+")"});
    if(e.pnw&&pa>t0&&pa<=t1) out.push({at:pa,s:d.s,tell:e.ty,t:e.pnw.replace("{n}",d.n)+" ("+d.s+")"}); });
  for(const m of minorNews(i,h)){ const at=h*HN+m.at; if(at>t0&&at<=t1) out.push({at,s:d.s,minor:1,t:m.t.replace("{n}",d.n)+" ("+d.s+")"}); }
  if(i===0&&s.cr!=null){ const at=h*HN+s.cr; if(at>t0&&at<=t1) out.push({at,s:"*",t:"📉 Market crash: panic selling everywhere"});
    if(h>=H2&&at-120>t0&&at-120<=t1) out.push({at:at-120,s:"*",tell:"crash",t:"⚠️ Futures sliding overnight, traders getting nervous"}); } });
  for(let sl=Math.floor(t0/EVSLOT);sl<=Math.floor(t1/EVSLOT)+1;sl++){ const e=bigEv(sl); if(e&&e.t0>t0&&e.t0<=t1) out.push({at:e.t0,s:"*",big:1,ev:e,t:(e.sc.dir>0?"🚀":"🚨")+" BREAKING: "+e.sc.t});
    if(e&&e.pw){ const at=e.t0-e.pw; if(at>t0&&at<=t1){ const tk=Object.entries(e.sc.fx).filter(([k])=>k!=="*"&&BYSYM[k]&&!BYSYM[k].gone).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3).map(([k,w])=>k);
      if(tk.length) out.push({at,s:"*",big:1,tell:"whisper",t:`👀 Big money is quietly ${e.sc.dir>0?"buying":"dumping"} ${tk.join(", ")}. Traders expect ${e.sc.dir>0?"good":"bad"} news ${e.sc.k==="f"?"any minute":"this week"}`}); } } }
  for(let day=Math.floor((t0/3600-6)/24);day<=Math.floor((t1/3600-6)/24);day++){ const g=regimeAt(day*24+6), at=(day*24+6)*3600;
    if(g&&g.type&&g.d0===day&&at>t0&&at<=t1&&at<H8*3600) out.push({at,s:"*",big:1,t:g.type>0?"📈 Bull run: investors are upbeat, stocks drifting higher":"📉 Bear market: nervous investors are selling, stocks drifting lower"}); }
  return out.sort((a,b)=>b.at-a.at); }

function lessonPic(id,dim){ const sp=LPIC[id]; if(!sp) return ""; const r=RNG("pic"+id), C=[], segEnd=[], LV={}; let p=100;
  sp.segs.forEach(([n,mv,vm,nz,o])=>{ for(let k=0;k<n;k++){ const op=p, cl=op+mv/n+(r()*2-1)*nz; let hi=Math.max(op,cl)+r()*nz*.7, lo=Math.min(op,cl)-r()*nz*.7;
      if(o&&o.sh==="star"){ hi=LV.hi??Math.max(op,cl)+2.4; LV.hi=hi; } if(o&&o.sh==="ham"){ lo=LV.lo??Math.min(op,cl)-2.4; LV.lo=lo; }
      if(o&&o.t==="hi"){ if(LV.hi==null) LV.hi=Math.max(op,cl)+.15; hi=LV.hi; } if(o&&o.t==="lo"){ if(LV.lo==null) LV.lo=Math.min(op,cl)-.15; lo=LV.lo; }
      C.push([op,hi,lo,cl,vm*(.8+r()*.4)]); p=cl; } segEnd.push(C.length-1); });
  const W=320,H=160,top=34,vh=24,bot=H-vh-6,n=C.length,cw=(W-10)/n, lo=Math.min(...C.map(c=>c[2]))-.6, hi=Math.max(...C.map(c=>c[1]))+.6, vmx=Math.max(...C.map(c=>c[4]));
  const X=i=>5+i*cw+cw/2, Y=v=>top+(hi-v)/(hi-lo)*(bot-top), bw=Math.max(2,cw*.62); let g="";
  for(let k=1;k<4;k++){ const y=top+(bot-top)*k/4; g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1a222c"/>`; }
  C.forEach((c,i)=>{ const up=c[3]>=c[0], col=up?LPG:LPR, x=X(i), h=c[4]/vmx*vh;
    g+=`<rect x="${x-bw/2}" y="${H-h}" width="${bw}" height="${h}" fill="${col}" opacity=".3"/><line x1="${x}" x2="${x}" y1="${Y(c[1])}" y2="${Y(c[2])}" stroke="${col}"/>`+
       `<rect x="${x-bw/2}" y="${Y(Math.max(c[0],c[3]))}" width="${bw}" height="${Math.max(1,Math.abs(Y(c[0])-Y(c[3])))}" fill="${col}"/>`; });
  const s0=k=>k?segEnd[k-1]+1:0;
  (sp.lines||[]).forEach(([kd,a,b,lab])=>{ const cs=C.slice(s0(a),segEnd[b]+1), v=kd==="hi"?Math.max(...cs.map(c=>c[1])):Math.min(...cs.map(c=>c[2])), y=Y(v);
    g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="${LPY}" stroke-dasharray="2 3" opacity=".75"/><text x="${W-4}" y="${kd==="hi"?y-4:y+10}" text-anchor="end" font-size="9" fill="${LPY}">${lab}</text>`; });
  (sp.spans||[]).forEach(([a,b,lab])=>{ const x1=X(s0(a))-cw/2, x2=X(segEnd[b])+cw/2, cs=C.slice(s0(a),segEnd[b]+1), y=Y(Math.min(...cs.map(c=>c[2])))+12;
    g+=`<path d="M${x1} ${y-4}V${y}H${x2}V${y-4}" fill="none" stroke="#8a97a8"/><text x="${(x1+x2)/2}" y="${y+10}" text-anchor="middle" font-size="9" fill="#cfd8e3">${lab}</text>`; });
  let TOPN=0; (sp.marks||[]).forEach(([k,lab,at,col])=>{ const i=segEnd[k], c=C[i], x=X(i);
    if(at==="top"){ const row=(TOPN++)%2, ty=11+row*11; g+=`<line x1="${x}" x2="${x}" y1="${ty+3}" y2="${bot}" stroke="#8a97a8" stroke-dasharray="2 3" opacity=".6"/><text x="${Math.min(Math.max(x,52),W-52)}" y="${ty}" text-anchor="middle" font-size="9" fill="#cfd8e3">${lab}</text>`; return; }
    const y=at==="up"?Y(c[1])-6:Y(c[2])+6, ty=at==="up"?y-5:y+13, fc=col||"#cfd8e3";
    g+=`<path d="M${x} ${y}l-3.5 ${at==="up"?-5:5}h7z" fill="${fc}"/><text x="${Math.min(Math.max(x,22),W-22)}" y="${ty}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${fc}">${lab}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;margin:8px 0 4px;background:#0a0d12;border:1px solid var(--line);border-radius:10px;font-family:Inter,sans-serif${dim?";opacity:.6":""}">${g}</svg>`; }
const utcDay=()=>{ const n=new Date(); return [n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()]; }; // today, so daylight saving time is right

  for(let h=Math.floor(t0/HN)-1;h<=Math.floor(t1/HN);h++){ const sc=sched(i,h); sc.eps.forEach(e=>{ const a=h*HN+e.st, b=a+epLen(e); if(a<=t1&&b>=t0) out.add(e.ty); });
    const c=sched(0,h).cr; if(c!=null){ const a=h*HN+c; if(a<=t1&&a+90>=t0) out.add("crash"); } }
  return out; }

  st.ws=win?(st.ws||0)+1:0; st.wsMax=Math.max(st.wsMax||0,st.ws); if(win&&side==="S") st.shortWins=(st.shortWins||0)+1; if(win&&pct>=100) f.x2=1;
  try{ const m=(S.mk[sym]||[]).filter(x=>x.k==="B"||x.k==="X").pop(), t0=m?m.t:NOW-60, ep=epsIn(BYSYM[sym].i,t0,NOW);
    if(ep.has("rumor")){ if(side==="L"&&pl<0) f.oops=1; if(side==="S"&&win) f.rmr=1; }
    if(win&&ep.has("pump")) f.pump=1; if(win&&ep.has("crash")) f.crash=1;
    if(win&&side==="L"&&ep.has("squeeze")) f.sq=1; if(win&&side==="S"&&ep.has("collapse")) f.col=1; }catch(_){}
  achCheck(); }

const sprMult=()=>0; // no spread: you fill exactly at the chart price
// ---------- player flow: other players' trades nudge prices a little ----------
// Each trade pushes its stock its way: the push builds over 20 s and fades over about 5 min.
// One trade moves a stock at most 0.4x its normal 1-minute swing; all players together at most 1x.
// Your own trades never move your own chart (no instant self-profit); they move everyone else's.
let FLOWEV=[], FLOWSEEN=new Set(), MYFLOW=[], flowDirty=false, flowBusy=false;
const LIQ=d=>Math.max(200,d.un*4,d.p*400); // dollars of trading that count as a full-size push
function flowImp(i,t){ if(!FLOWEV.length) return 0; const u=SER[i].vol*Math.sqrt(60); let s=0;
  for(const e of FLOWEV){ if(e.i!==i||t<=e.t) continue; const a=t-e.t; if(a>1800) continue; s+=e.dir*.4*u*Math.tanh(e.usd/LIQ(SER[i]))*Math.min(1,a/20)*Math.exp(-a/300); }
  return u*Math.tanh(s/u); }
const pxi=(i,t)=>{ const p=price(i,t); return FLOWEV.length?p*Math.exp(flowImp(i,t)):p; };
const sp=sym=>pxi(BYSYM[sym].i,NOW);
// Big orders fill a little worse than the chart (market impact). Tiny orders: basically nothing.
const slip=(sym,usd)=>{ const d=BYSYM[sym]; return .4*d.vol*Math.sqrt(60)*Math.tanh(Math.max(0,usd)/LIQ(d)); };
const fillBuy=(sym,q)=>{ const a=ask(sym); return a*Math.exp(slip(sym,q*a)); }, fillSell=(sym,q)=>{ const b=bid(sym); return b*Math.exp(-slip(sym,q*b)); };
function maxQty(sym){ let q=Math.floor(Math.max(0,S.cash)/ask(sym)/(1+STX())); while(q>1&&q*fillBuy(sym,q)*(1+STX())>S.cash) q=Math.floor(q*.995); return q; }

// and the share price drops by the dividend that day; and a 0.04% yearly expense ratio taken out of the price.
const IXDIV=42*3600, IXER=.0004, IXQ=[], IXDC=[1], H7S=()=>H7*3600;
const ixQ=k=>{ while(IXQ.length<=k) IXQ.push(.0028+.001*RNG("ixd"+IXQ.length)()); return IXQ[k]; };
const ixN=t=>t<H7S()?0:Math.floor((t-H7S())/IXDIV); // dividends paid at or before t
const ixD=t=>{ const n=ixN(t); while(IXDC.length<=n){ const k=IXDC.length; IXDC.push(IXDC[k-1]*(1+ixQ(k))); } return IXDC[n]; };
const ixE=t=>t<=H7S()?1:Math.exp(-IXER*(t-H7S())/604800);
const trv=(t,p)=>(p??price(II,t))*ixE(t);          // what one unit is worth

function trade(act,q){
  const sym=S.sel, p=P(sym); q=Math.floor(q);
  if((act==="buy"||act==="short")&&(p.l||p.s)) return toast("You already have a trade open in "+sym+". Close it first.");
  if(act==="buy"||act==="short") p.bot=null;
  if(act==="buy"){ const a=fillBuy(sym,q); if(inDebt()) return toast("Pay off your debt first"); if(q<1||q*a*(1+STX())>S.cash+1e-9) return toast("Not enough cash for "+q+" share"+(q>1?"s":"")+" plus sales tax");
    p.lc=(p.lc*p.l+q*a)/(p.l+q); p.l+=q; S.cash-=q*a; const tx=salesTax(q*a); flowPush(sym,1,q*a); autoStops(sym); mark(sym,"B",sp(sym)); toast(`Bought ${q} ${sym} at ${px(a)} (${money(q*a)} + ${money(tx)} sales tax)`); }
  if(act==="sell") sellLong(sym,Math.min(q,p.l));
  if(act==="short"){ const b=fillSell(sym,q); if(inDebt()) return toast("Pay off your debt first"); if(q<1||q*b*(1+STX())>S.cash+1e-9) return toast("Not enough cash to back "+q+" share"+(q>1?"s":"")+" plus sales tax");
    p.se=(p.se*p.s+q*b)/(p.s+q); p.s+=q; S.cash-=q*b; const tx=salesTax(q*b); flowPush(sym,-1,q*b); autoStops(sym); mark(sym,"X",sp(sym)); toast(`Shorted ${q} ${sym} at ${px(b)} (${money(q*b)} held as collateral, ${money(tx)} sales tax)`); }
  if(act==="cover"){ cover(sym,Math.min(q,p.s)); }
  if((act==="buy"||act==="short")&&(p.l||p.s)){ preStops(sym); sfx(act==="short"?'short':'open'); tipTag(sym,act==="buy"?1:-1); }
  resetPeak(); chips(); build(true);
}

// ---------- taxes ----------
// In this game a "year" is one real week. Tax day is every Monday at midnight (your time).
// Sales tax: a small cut on every stock you buy or sell. Tax day bills: income tax (real US brackets on

        else h+=`<div class="tn ${open?"cur":""}"><div class="row"><div class="g"><b>Lesson ${i+1} · ???</b><div class="t">${open?"Buy it to find out what it teaches.":"🔒 Learn the one before it first."}</div></div>${open?`<button class="btn gold sm" data-kn="${k.id}" data-cost="${k.c}">${money(k.c)}</button>`:`<span class="t m">${money(k.c)}</span>`}</div></div>`; });

// ---------- weekly competition: opt-in, separate $1,000 wallet, your real money is never touched ----------
const WEEK0=345600, COMP_START=1000, wkIdx=t=>Math.floor((t-WEEK0)/604800), wkStart=w=>WEEK0+w*604800; // weeks run Monday 00:00 UTC to Monday
let CB={list:null,w:-1,busy:false,view:'all'}, CPL=0;
// ---- registration + real cash prizes ----
// Week N's competition: register during week N-1 (register / unregister freely, your net worth is recorded when you
// register). The moment week N starts, registration locks (the database refuses changes after that) and the prizes
// are fixed from the AVERAGE recorded net worth of everyone registered. Only registered players can play week N.
// Prizes: 1st = 60% of the average (min $25), 2nd = 1st/4, 3rd = 1st/16 (see prizesFor). Needs 2+ players.
const r25=v=>Math.max(25,Math.round(v/25)*25);
// 1st: 60% of the average, rounded to $25, at least $25. 2nd and 3rd: a quarter of the place above, no minimum,
// rounded to a step that fits their size ($25 from $100 up, $5 from $10 up, else $1) so small prizes don't round to $0.
const rNice=v=>v>=100?Math.round(v/25)*25:v>=10?Math.round(v/5)*5:Math.max(1,Math.round(v));
const prizesFor=avg=>{ const p1=r25(avg*.6); return [p1,rNice(p1/4),rNice(p1/16)]; };

let LASTIMG=null;
function cropPhoto(im){ LASTIMG=im; const W=im.naturalWidth||im.width, H=im.naturalHeight||im.height, mn=Math.min(W,H), V=240; let z=1, cx=W/2, cy=H/2;
  modal('Crop your photo',`<div style='width:${V}px;height:${V}px;margin:8px auto;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#000'><canvas id='ccv' width='${V*2}' height='${V*2}' style='width:${V}px;height:${V}px;display:block;touch-action:none;cursor:grab'></canvas></div><input type='range' id='czoom' min='1' max='4' step='0.01' value='1' style='width:100%;margin-top:6px'><div class='t' style='text-align:center'>Drag to move · slide or pinch to zoom</div>`,[['Cancel','ghost'],['Save photo','gold',()=>savePhoto(im,cx,cy,mn/z)]]); $('modal').dataset.lock=1; // a drag that ends outside the box mustn't close it unsaved
  const cv=$('ccv'), c=cv.getContext('2d'), zs=$('czoom');
  const draw=()=>{ const h=mn/z/2; cx=Math.min(W-h,Math.max(h,cx)); cy=Math.min(H-h,Math.max(h,cy)); c.clearRect(0,0,cv.width,cv.height); c.drawImage(im,cx-h,cy-h,2*h,2*h,0,0,cv.width,cv.height); };

// ---------- updates (manual) ----------
// APPV goes up with every release (same number as the service worker cache). New versions download in the background
// (the service worker installs and then waits); nothing changes until you tap "Update now" in Settings → App.
// The gear gets a dot and you get one heads-up when an update is ready.
const APPV="125";
let UPD={ready:false,ver:null,told:false};

async function liveVer(){ try{ const r=await fetch("index.html?v="+Date.now(),{cache:"no-store"}); if(!r.ok) return null; const m=(await r.text()).match(/const APPV="([^"]+)"/); return m?m[1]:null; }catch(_){ return null; } }
const swReg=async()=>{ try{ return "serviceWorker" in navigator?await navigator.serviceWorker.getRegistration():null; }catch(_){ return null; } };
// ask the service worker which version you accepted and which one it has downloaded
function swAsk(msg){ return new Promise(res=>{ const ctl=navigator.serviceWorker&&navigator.serviceWorker.controller; if(!ctl) return res(null);
  const ch=new MessageChannel(); ch.port1.onmessage=e=>res(e.data); ctl.postMessage(msg,[ch.port2]); setTimeout(()=>res(null),3000); }); }
const verOf=c=>c&&c.replace(/^tt-v/,"");
// red "1" on the real app icon while an update is waiting (iPhone Home Screen app, needs notifications allowed)
function appBadge(n){ try{ if(n&&navigator.setAppBadge) navigator.setAppBadge(n).catch(()=>{}); else if(!n&&navigator.clearAppBadge) navigator.clearAppBadge().catch(()=>{}); }catch(_){} }
function updMark(){ const g=$("gear"); if(g) g.classList.toggle("upd",UPD.ready); appBadge(UPD.ready?1:0);
  if(UPD.ready&&!UPD.told){ UPD.told=true; toast(`⬆️ Version ${UPD.ver} is ready. Install it from Settings → Update now`); }
  if(!$("modal").classList.contains("hide")&&$("updrow")===null&&UPD.ready&&$("muslbl")) openSettings(); }
async function swState(){ const st=await swAsk({type:"state"}); if(!st||!st.accepted) return; const ready=st.latest!==st.accepted&&verOf(st.latest)!==APPV; if(!ready) appBadge(0);
  if(ready!==UPD.ready){ UPD.ready=ready; UPD.ver=verOf(st.latest); updMark(); } }
// look for a new version (it downloads in the background if there is one); manual = from the Check button
async function checkUpdate(manual){ const r=await swReg();
  if(manual&&UPD.ready) return toast(`Version ${UPD.ver} is ready. Tap Update now`);
  const v=await liveVer(); if(r){ try{ await r.update(); }catch(_){} }
  setTimeout(swState,1500);
  if(!manual) return;
  if(!v) return toast("Couldn't check for updates. Are you online?");
  if(v===APPV) return toast(`✅ You're on the newest version (${APPV})`,"good");
  toast(`⬆️ Version ${v} found. Downloading…`);
  const t0=Date.now(); const wait=async()=>{ await swState(); if(UPD.ready) return; if(Date.now()-t0<25000) setTimeout(wait,1500); else toast("Still downloading. Check again in a minute"); }; setTimeout(wait,1500); }
async function applyUpdate(){ save(); if(ACT) await csave(); appBadge(0); toast("Updating…"); await swAsk({type:"accept"}); setTimeout(()=>location.reload(),300); }
if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("controllerchange",()=>setTimeout(swState,500));
swState(); setInterval(()=>checkUpdate(),600000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkUpdate(); });
