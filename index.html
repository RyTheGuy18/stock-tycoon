<style>
:root{--bg:#07090c;--panel:#0e1319;--card:#121922;--c2:#18212c;--line:#1f2a36;--text:#e8eef4;--mut:#77879a;--up:#16c784;--dn:#ea3943;--gold:#f5b301;--pur:#a855f7}

 {s:"PNNY",n:"Penny Pete's Pawn",p:.6,vol:.0075,beta:.6,spr:.012,un:0,pump:1},

STOCKS.forEach(d=>{d.tr=1.2e-7;d.ar=.97;d.sdh=d.vol*36;}); STOCKS[0].sdh=STOCKS[0].vol*2; STOCKS[0].ar=.5; STOCKS[0].lv=1;
// ---- time-of-day behavior ----
// morning open (14:00 UTC): +1 follows its 24h trend, -1 reverses it, 0 = no special open (PNNY)
const OPEN_H=14, REV=["SODA","WAVE","AURM","MEGA"]; let RK=1.65, OK=1.9;
function setupRituals(){ STOCKS.forEach((d,i)=>{ d.od=i===0?0:REV.includes(d.s)?-1:1; d.sto=Math.sqrt(d.vol*d.vol+Math.pow(.0003*d.beta,2));
  const r=RNG("rit"+i), n=i===0?6:3, used=new Set([OPEN_H]); d.rit=[];
  while(d.rit.length<n){ const h=Math.floor(r()*24); if(used.has(h)) continue; used.add(h); const L=i===0?180:[180,240,300][Math.floor(r()*3)];
    const m=60*(8+Math.floor(r()*((3480-2*L)/60-8))); d.rit.push({h,m,L,dir:r()<.5?1:-1,D:RK*d.sto*Math.sqrt(L)}); }

  const w=[["breakout",3],["fakeout",3],["beat",1.4],["rumor",1.4],["deadcat",1.8],["collapse",nw?.03:.22],["squeeze",nw?.035:.25]];

    deadcat:{nw:"⚠️ Report: {n} under federal investigation",ph:[[25,-.42,3],[40,.17,.8],[260,-.1,1.3]]},
    pump:{ph:[[60,.55,10],[240,-.2,1.8]]}};

// ---------- candle-shape patterns (from H3) ----------

const SHAPES={

        if(!s){ miss=true; break; } if(o===null) o=s[0]; if(s[1]>h)h=s[1]; if(s[2]<l)l=s[2]; c=s[3]; v+=s[4]; } }
    else { o=pxi(i,s0); h=l=c=o; for(let t2=s0;t2<=e;t2++){ const p=pxi(i,t2); if(p>h)h=p; if(p<l)l=p; c=p; v+=volAt(i,t2); } }

    const k=[o,h,l,c,v,s0]; if(done){ CC.set(key,k); if(CC.size>20000) CC.delete(CC.keys().next().value); } out.unshift(k); }

function lessonPic(id,dim){ const sp=LPIC[id]; if(!sp) return ""; const r=RNG("pic"+id), C=[], segEnd=[], LV={}; let p=100;
  sp.segs.forEach(([n,mv,vm,nz,o])=>{ for(let k=0;k<n;k++){ const op=p, cl=op+mv/n+(r()*2-1)*nz; let hi=Math.max(op,cl)+r()*nz*.7, lo=Math.min(op,cl)-r()*nz*.7;
      if(o&&o.sh==="star"){ hi=LV.hi??Math.max(op,cl)+2.4; LV.hi=hi; } if(o&&o.sh==="ham"){ lo=LV.lo??Math.min(op,cl)-2.4; LV.lo=lo; }
      if(o&&o.t==="hi"){ if(LV.hi==null) LV.hi=Math.max(op,cl)+.15; hi=LV.hi; } if(o&&o.t==="lo"){ if(LV.lo==null) LV.lo=Math.min(op,cl)-.15; lo=LV.lo; }
      C.push([op,hi,lo,cl,vm*(.8+r()*.4)]); p=cl; } segEnd.push(C.length-1); });
  const W=320,H=160,top=34,vh=24,bot=H-vh-6,n=C.length,cw=(W-10)/n, lo=Math.min(...C.map(c=>c[2]))-.6, hi=Math.max(...C.map(c=>c[1]))+.6, vmx=Math.max(...C.map(c=>c[4]));
  const X=i=>5+i*cw+cw/2, Y=v=>top+(hi-v)/(hi-lo)*(bot-top), bw=Math.max(2,cw*.62); let g="";
  for(let k=1;k<4;k++){ const y=top+(bot-top)*k/4; g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1a222c"/>`; }
  C.forEach((c,i)=>{ const up=c[3]>=c[0], col=up?LPG:LPR, x=X(i), h=c[4]/vmx*vh;
    g+=`<rect x="${x-bw/2}" y="${H-h}" width="${bw}" height="${h}" fill="${col}" opacity=".3"/><line x1="${x}" x2="${x}" y1="${Y(c[1])}" y2="${Y(c[2])}" stroke="${col}"/>`+
       `<rect x="${x-bw/2}" y="${Y(Math.max(c[0],c[3]))}" width="${bw}" height="${Math.max(1,Math.abs(Y(c[0])-Y(c[3])))}" fill="${col}"/>`; });
  const s0=k=>k?segEnd[k-1]+1:0;
  (sp.lines||[]).forEach(([kd,a,b,lab])=>{ const cs=C.slice(s0(a),segEnd[b]+1), v=kd==="hi"?Math.max(...cs.map(c=>c[1])):Math.min(...cs.map(c=>c[2])), y=Y(v);
    g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="${LPY}" stroke-dasharray="2 3" opacity=".75"/><text x="${W-4}" y="${kd==="hi"?y-4:y+10}" text-anchor="end" font-size="9" fill="${LPY}">${lab}</text>`; });
  (sp.spans||[]).forEach(([a,b,lab])=>{ const x1=X(s0(a))-cw/2, x2=X(segEnd[b])+cw/2, cs=C.slice(s0(a),segEnd[b]+1), y=Y(Math.min(...cs.map(c=>c[2])))+12;
    g+=`<path d="M${x1} ${y-4}V${y}H${x2}V${y-4}" fill="none" stroke="#8a97a8"/><text x="${(x1+x2)/2}" y="${y+10}" text-anchor="middle" font-size="9" fill="#cfd8e3">${lab}</text>`; });
  let TOPN=0; (sp.marks||[]).forEach(([k,lab,at,col])=>{ const i=segEnd[k], c=C[i], x=X(i);
    if(at==="top"){ const row=(TOPN++)%2, ty=11+row*11; g+=`<line x1="${x}" x2="${x}" y1="${ty+3}" y2="${bot}" stroke="#8a97a8" stroke-dasharray="2 3" opacity=".6"/><text x="${Math.min(Math.max(x,52),W-52)}" y="${ty}" text-anchor="middle" font-size="9" fill="#cfd8e3">${lab}</text>`; return; }
    const y=at==="up"?Y(c[1])-6:Y(c[2])+6, ty=at==="up"?y-5:y+13, fc=col||"#cfd8e3";
    g+=`<path d="M${x} ${y}l-3.5 ${at==="up"?-5:5}h7z" fill="${fc}"/><text x="${Math.min(Math.max(x,22),W-22)}" y="${ty}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${fc}">${lab}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;margin:8px 0 4px;background:#0a0d12;border:1px solid var(--line);border-radius:10px;font-family:Inter,sans-serif${dim?";opacity:.6":""}">${g}</svg>`; }
const utcDay=()=>{ const n=new Date(); return [n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()]; }; // today, so daylight saving time is right
function lt(h,sec){ const [y,m,d]=utcDay(); return new Date(Date.UTC(y,m,d,h,0,sec||0)).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}); }
function flushTimes(){ return [0,3,6,9,12,15,18,21].map(h=>lt(h)).join(", "); }

function tod(h){ const [y,m,d]=utcDay(), x=new Date(Date.UTC(y,m,d,h)).getHours(); return x<5?"late-night":x<11?"morning":x<14?"lunchtime":x<18?"afternoon":x<22?"evening":"late-night"; }

function epsIn(i,t0,t1){ const out=new Set(); t0=Math.max(t0,t1-6*3600);
  for(let h=Math.floor(t0/HN)-1;h<=Math.floor(t1/HN);h++){ const sc=sched(i,h); sc.eps.forEach(e=>{ const a=h*HN+e.st, b=a+epLen(e); if(a<=t1&&b>=t0) out.add(e.ty); });
    const c=sched(0,h).cr; if(c!=null){ const a=h*HN+c; if(a<=t1&&a+90>=t0) out.add("crash"); } }
  return out; }
function achTrade(sym,side,pl,pct){ const st=S.st, f=AF(), win=pl>0;
  st.ws=win?(st.ws||0)+1:0; st.wsMax=Math.max(st.wsMax||0,st.ws); if(win&&side==="S") st.shortWins=(st.shortWins||0)+1; if(win&&pct>=100) f.x2=1;
  try{ const m=(S.mk[sym]||[]).filter(x=>x.k==="B"||x.k==="X").pop(), t0=m?m.t:NOW-60, ep=epsIn(BYSYM[sym].i,t0,NOW);
    if(ep.has("rumor")){ if(side==="L"&&pl<0) f.oops=1; if(side==="S"&&win) f.rmr=1; }
    if(win&&ep.has("pump")) f.pump=1; if(win&&ep.has("crash")) f.crash=1;

const clk=t=>new Date(t*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});

function autoInfo(x){ const a=A(x.id), v=a.own?a.v:(x.set||[])[3], li=arr=>`<ul class="axl">${arr.filter(Boolean).map(t=>`<li>${t}</li>`).join("")}</ul>`, P0=STOCKS[0];

   case "rit": { let n=0, nx=null; STOCKS.forEach(d=>{ if(d.gone||!unlocked(d)) return; d.rit.forEach((R,j)=>{ if(!S.know[d.s+"_r"+j]) return; n++; const t=nextSod(R.h*3600+R.m); if(!nx||t<nx.t) nx={t,s:d.s}; }); });
     return li([`Trades the <b>daily routine lessons you've bought</b> (in each stock's lessons in the Store), at the exact times they say: the first half, then flips for the second half.`,`Uses <b>${v}%</b> of your cash per trade and keeps 10% of any profit.`,`<b>Only opens trades while the app is closed</b>, and sits out while you have a trade of your own open. If you come back mid-trade, it still finishes that trade.`,`Skips a stock if you already have a trade open in it.`,`Your Default stop loss / take profit also apply to its trades.`,n?`You've learned <b>${n}</b> routine${n>1?"s":""}. Next: <b>${nx.s} ${inT(nx.t)}</b>.`:`<b>You haven't learned any routines yet</b>, so it has nothing to trade.`]); }
   case "openb": { const t=nextSod(OPEN_H*3600+5), n=STOCKS.filter(d=>!d.gone&&unlocked(d)&&d.od&&S.know[d.s+"_open"]).length;
     return li([`At the morning open (<b>${clk(t)}</b> your time), it trades every stock whose <b>"at the morning open" lesson</b> you own, in the direction that lesson says, and closes 10 minutes later.`,`Uses <b>${v}%</b> of your cash per stock and keeps 10% of any profit. With several stocks it splits up your cash quickly, so start small.`,`<b>Only trades while the app is closed</b>, and sits out while you have a trade of your own open. If you come back mid-trade, it still finishes that trade.`,`PNNY has no morning open.`,n?`You own <b>${n}</b> open lesson${n>1?"s":""}. Next open: <b>${inT(t)}</b>.`:`<b>You don't own any open lessons yet</b>, so it has nothing to trade.`]); }
   case "pscalp": { let t=null; P0.rit.forEach(R=>{ const u=nextSod(R.h*3600+R.m); if(!t||u<t) t=u; });
     return li([`PNNY has <b>6 routines a day</b>: a move one way, then back the other. This bot trades both halves, at the same times every day.`,...pnny,`Next routine: <b>${inT(t)}</b>.`,`Won about 95% in testing.`]); }

   case "ppump": return li([`When a pump starts on PNNY, it waits 60 seconds for the spike, then <b>shorts the top</b> and covers 4 minutes later, after the dump.`,...pnny,`Pumps come at random, a few times a day.`,`Won about 99% in testing.`]);

   case "resup": { const pr=prof(); return li([`Before a job starts, if you don't have enough ${pr?pr.sup.toLowerCase():"supplies"} for it, it buys enough for <b>4 jobs</b> automatically.`,`Only if you have the cash. Otherwise the job won't start.`,`Pairs with Booking app, so back-to-back jobs never stall for supplies.`]); }
   case "book": return li([`When a job finishes, it starts your <b>best job</b> right away, including while you're away.`,`"Best" means the highest-paying job you've learned and have the gear for.`,`It stops if your gear breaks (unless you have Auto-repair) or you run out of supplies (unless you have Auto-resupply).`,`If you switched professions, it waits until you start a job yourself.`]);

  } return ""; }
function buildAuto(){ let h=`<div class="pad"><div class="t" style="margin:0 3px 8px">Bots only trade while the app is closed, and they <b>sit out while you have a trade of your own open</b>. Close your trades before you leave if you want the bots to work. You lose automations if you go broke.</div>`;

      h+=`<div class="card"><div class="row"><div class="g"><div class="b">${x.n}</div><div class="t">${x.d}</div><button class="aexp" data-aexp="${x.id}">${ex?"Hide details ▴":"How it works ▾"}</button></div>${a.own?`<button class="btn ${a.on?"buy":"ghost"} sm" data-atog="${x.id}">${a.on?"ON":"OFF"}</button>`:`<button class="btn gold sm" data-abuy="${x.id}" data-cost="${x.c}">${money(x.c)}</button>`}</div>
      ${a.own&&x.set?`<div class="t" style="margin-top:8px">Setting: <b style="color:var(--text)" id="av-${x.id}">${a.v}${x.set[4]}</b></div><input type="range" style="width:100%" min="${x.set[0]}" max="${x.set[1]}" step="${x.set[2]}" value="${a.v}" data-aset="${x.id}">`:""}${ex?`<div class="axd">${autoInfo(x)}</div>`:""}</div>`; }); });
  main.dataset.h=main.innerHTML=h+"</div>"; }
// ---------- stop loss / take profit ----------
const ORD=sym=>{ S.ord=S.ord||{}; return S.ord[sym]||(S.ord[sym]={}); };
function checkOrders(){ if(!S.ord) return; for(const sym in S.ord){ const o=S.ord[sym], p=P(sym), pr=sp(sym);
  if(p.l){ if(o.lsl&&pr<=o.lsl) sellLong(sym,p.l,"Stop loss:"); else if(o.ltp&&pr>=o.ltp) sellLong(sym,p.l,"Take profit:"); }
  if(p.s){ if(o.ssl&&pr>=o.ssl) cover(sym,p.s,"Stop loss:"); else if(o.stp&&pr<=o.stp) cover(sym,p.s,"Take profit:"); }
  if(!p.l){ delete o.lsl; delete o.ltp; } if(!p.s){ delete o.ssl; delete o.stp; } } }
function orderModal(key){ const sym=S.sel, p=P(sym), lng=key[0]==="l", stop=key.slice(1)==="sl", en=lng?p.lc:p.se, now=sp(sym), o=ORD(sym);
  const up=(lng&&!stop)||(!lng&&stop), ok=v=>up?v>now:v<now;
  const chips=[1,2,3,5,10,20].map(x=>{ const v=en*(1+(up?x:-x)/100); return `<button class="btn ${stop?"sell":"buy"} sm" data-op="${key}:${v}" ${ok(v)?"":"disabled"} style="margin:3px">${up?"+":"−"}${x}%<small>${px(v)}</small></button>`; }).join("");
  modal(`${stop?IC.sl+"Stop loss":IC.tp+"Take profit"} · ${lng?"long":"short"} ${sym}`,`<p>Automatically ${lng?"sell":"cover"} all ${lng?p.l:p.s} shares if ${sym} ${up?"rises to":"falls to"} this price. Works while you're away. Your entry was <b>${px(en)}</b>; it's at <b>${px(now)}</b> now.</p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center">${chips}</div>
    <div class="row" style="margin-top:8px"><input id="opx" class="inp g" inputmode="decimal" placeholder="Or type a price"><button class="btn gold sm" data-op="${key}:custom">Set</button></div>
    ${o[key]?`<button class="btn ghost sm" style="width:100%;margin-top:8px" data-op="${key}:off">Remove (currently ${px(o[key])})</button>`:""}`,[["Cancel","ghost"]]); }
function setOrder(arg){ const [key,v]=arg.split(":"), o=ORD(S.sel), now=sp(S.sel), lng=key[0]==="l", stop=key.slice(1)==="sl", up=(lng&&!stop)||(!lng&&stop);
  if(v==="off"){ delete o[key]; closeModal(); toast("Removed"); return build(true); }
  const val=v==="custom"?+$("opx").value:+v; if(!(val>0)) return toast("Enter a price");
  if(up?val<=now:val>=now) return toast(`That price needs to be ${up?"above":"below"} ${px(now)}`);
  o[key]=val; closeModal(); toast(`${stop?"Stop loss":"Take profit"} set at ${px(val)}`); build(true); }
function cover(sym,q,why){ const p=P(sym); if(q<1) return; const a=fillBuy(sym,q), col=q*p.se, pl=Math.max(q*(p.se-a),-col), en=p.se; flowPush(sym,1,q*a);
  S.cash+=col+pl; const tx=salesTax(q*a); p.s-=q; if(!p.s) p.se=0; rec(sym,"S",q,en,a,pl); mark(sym,"C",sp(sym),pl); const net=pl-tx2(q*en)-tx; if(taxTrap(pl,net)) sfx('loss'); else winFx(pl); tipCredit(sym,pl);
  toast(taxTrap(pl,net)?`${why||"Covered"} ${q} ${sym}: PROFIT ${sg(pl)}, but after taxes you LOST ${money(-net)}`:`${why||"Covered"} ${q} ${sym}: ${pl>=0?"PROFIT":"LOSS"} ${sg(pl)} · sales tax -${money(tx)}`,pl>=0&&!taxTrap(pl,net)?"good":"bad"); if(why) life(`${why} ${sym}: ${sg(pl)}`);  chips(); }

// ---------- mom's practice trades ----------
const PQ=2; // Mom's practice rounds count as 2 shares
function paper(dir){ const sym=S.sel; S.paper={sym,dir,en:dir==="L"?ask(sym):bid(sym),t:NOW}; sfx(dir==="S"?'short':'open'); toast(`📝 Practice ${dir==="L"?"buy":"short"}: ${PQ} ${sym} at ${px(S.paper.en)}`); build(true); }
function paperClose(){ const c=S.paper; if(NOW-c.t<15) return toast("Hold it at least 15 seconds");
  const ex=c.dir==="L"?bid(c.sym):ask(c.sym), pl=(c.dir==="L"?ex-c.en:c.en-ex)*PQ; S.paper=null; S.st.paper++;
  if(pl>0){ const pay=Math.round(pl*5*100)/100; S.streak++; S.cash+=pay; txInc(pay); S.st.paperWon++; S.st.paperPay+=pay; lunchMoney(); sfx('win'); toast(`✅ Practice profit ${sg(pl)}. Mom pays you ${money(pay)}!`,"good"); life(`📝 Practice trade won · Mom paid ${money(pay)}`); }
  else { S.streak=0; sfx('loss'); toast(`❌ Practice loss ${sg(pl)}. "Try again, sweetie."`,"bad"); }
  build(true); }

// ---------- jobs ----------
function jobTime(id,j,t){ return Math.round(j.min*60*.8*durMult(id,t)); }
const skill=id=>pst(id).sk||0;
function startJob(k,auto){ const p=prof(), j=p.jobs[k], s=pst(), t=tier(p.id); if(S.job||t<j.t||k>skill(p.id)) return false;
  const use=FUSE[t];
  if(use){ if(s.fuel+1e-9<use&&aOn("resup")){ const need=use*4-s.fuel, c=need*supP(p); if(S.cash>=c){ S.cash-=c; s.fuel+=need; resetPeak(); } }
    if(s.fuel+1e-9<use){ if(!auto) toast("Out of "+p.sup.toLowerCase()+". Refill in the Store."); return false; } s.fuel-=use; }
  S.job={p:p.id,k,t,start:NOW,end:NOW+jobTime(p.id,j,t),pay:Math.round(j.pay*payMult(p.id)*100)/100};
  if(!auto){ closeModal(); toast(`${p.i} Started: ${j.n}`); lunchMoney(); build(); } return true; }
function bestJob(){ const p=prof(), t=tier(p.id), sk=skill(p.id); let b=-1; p.jobs.forEach((j,k)=>{ if(j.t<=t&&k<=sk) b=k; }); return b; }
// learn the next job: training cost + reputation (+ the gear tier to actually work it)
function learnJob(k){ const p=prof(), s=pst(), j=p.jobs[k]; if(!j||k!==skill(p.id)+1) return;
  if(s.rep<j.rq) return toast(`You need ★${j.rq} reputation first (you have ★${s.rep})`);
  if(S.cash<j.tc) return toast(`Training costs ${money(j.tc)}`);
  S.cash-=j.tc; s.sk=k; resetPeak(); life(`🎓 Learned: ${j.n}`); toast(`🎓 Learned a new job: ${j.n}`,"good"); sfx('unlock'); save(); jobPicker(); }
function finishJob(){ const jb=S.job, p=PB[jb.p], j=p.jobs[jb.k], s=pst(jb.p); S.job=null;
  S.cash+=jb.pay; txInc(jb.pay); S.st.jobs++; S.st.jobPay+=jb.pay; s.rep++;
  if(aOn("inv")){ const a=jb.pay*aV("inv")/100; S.cash-=a; S.fu+=a/price(II,NOW); S.fbasis+=a; resetPeak(); }
  let msg=`${p.i} ${j.n}: +${money(jb.pay)}`;
  if(Math.random()<GBRK[jb.t]*eff("brk",jb.p)){ if(s.up.insure){ msg+=" · gear broke, insurance fixed it"; } else { const fc=Math.max(3,GCOST[jb.t]*.25); S.st.breaks++; if(aOn("fix")&&S.cash>=fc){ S.cash-=fc; resetPeak(); msg+=` · gear broke, auto-repaired (-${money(fc)})`; } else { s.br[jb.t]=true; if(jb.t===0) s.momFix=NOW+3600; msg+=` · your ${p.gear[jb.t]} broke!`; } } }
  life(msg); toast(msg,"good"); sfx('pay');
  if(aOn("book")&&S.prof===jb.p){ const b=bestJob(); if(b>=0) startJob(b,true); } }

// ---------- bills, debt, broke ----------
const earned=()=>S.st.jobPay+S.st.paperPay+Math.max(0,S.st.realized);
function bill(t,a){ a=Math.round(a*100)/100; if(a<=0) return; S.cash-=a; S.st.bills+=a; if(inDebt()&&!S.debtDue) S.debtDue=NOW+86400; resetPeak(); life(`${t}: -${money(a)}`); toast(`${t}: -${money(a)}`,"bad"); sfx('bill'); }
function bills(){ const e=earned();
  if(e>=100&&!S.ms.condo){ if(!S.rentAt) S.rentAt=NOW+86400; else if(NOW>=S.rentAt){ S.rentAt+=86400; S.ms.apt?bill("🏢 Apartment rent",30):bill("🏠 Mom's rent",5); } }
  if(e>=30&&!S.ms.house&&Math.random()<1/21600){ const b=pick(BILLS); bill(b[0],((b[1]+Math.random()*(b[2]-b[1]))*Math.min(1,Math.max(.1,e/1500))+Math.max(0,S.cash)*b[3])*eff("bill")); } }
// ---------- taxes ----------
// In this game a "year" is one real week. Tax day is every Monday at midnight (your time).
// Sales tax: a small cut on every stock you buy or sell. Tax day bills: income tax (real US brackets on
// this week's job pay + trading profits), property tax on homes you own, and a war tax in war years.
const SALES_TAX=.005;
const BRACKETS=[[11925,.10],[48475,.12],[103350,.22],[197300,.24],[250525,.32],[626350,.35],[Infinity,.37]]; // 2025 single filer
const HOMES=[["apt",4000,"Apartment"],["condo",100000,"Condo"],["cabin",1.2e6,"Lake cabin"],["house",3e6,"Dream house"],["island",1e8,"Private island"]];
const taxWk=t=>Math.floor((t-new Date(t*1000).getTimezoneOffset()*60-345600)/604800);   // weeks since Mon Jan 5 1970, local time
const taxDayAt=w=>{ const g=w*604800+345600+604800; return g+new Date(g*1000).getTimezoneOffset()*60; }        // next Monday 00:00 local
const warYear=w=>RNG("war"+w)()<1/6;                                                                         // about 1 week in 6
function TX(){ const w=taxWk(NOW); if(!S.tx||S.tx.w==null) S.tx={w,inc:0,gain:0,sales:0}; return S.tx; }
const txInc=a=>{ TX().inc+=a; }, txGain=a=>{ TX().gain+=a; };
// after-tax result of an open trade: profit minus the sales tax paid to open it and the tax you'd pay to close it now
const tx2=v=>Math.round(v*SALES_TAX*100)/100;
const netLine=(g,n)=>taxTrap(g,n)?`<div class="taxw-t">⚠️ Taxes eat this profit. After tax you'd <b>lose ${money(-n)}</b></div>`:`<div class="t" style="font-size:11.5px;margin-top:2px;text-align:right">after tax ${sg(n)}</div>`;
function netPL(sym){ const p=P(sym); if(p.l){ const b=bid(sym); return p.l*(b-p.lc)-tx2(p.l*p.lc)-tx2(p.l*b); } if(p.s){ const a=ask(sym); return Math.max(p.s*(p.se-a),-p.s*p.se)-tx2(p.s*p.se)-tx2(p.s*a); } return 0; }
const taxTrap=(g,n)=>g>0&&n<0; // "profit" that is really a loss once taxes are paid
function salesTax(amt){ const t=Math.round(amt*SALES_TAX*100)/100; if(t<=0) return 0; S.cash-=t; TX().sales+=t; S.st.taxes=(S.st.taxes||0)+t; return t; }
function incomeTax(x){ let t=0, lo=0; for(const [hi,r] of BRACKETS){ if(x<=lo) break; t+=(Math.min(x,hi)-lo)*r; lo=hi; } return t; }
function taxBill(tx,war){ const base=Math.max(0,tx.inc+Math.max(0,tx.gain)), acct=S.ms.acct?.85:1, it=incomeTax(base)*acct;
  const homes=HOMES.filter(h=>S.ms[h[0]]), pt=homes.reduce((a,h)=>a+h[1]*.01,0)*acct;
  const wt=war?Math.max(0,netWorth()-1000)*.02*acct:0;
  return {base,it,pt,wt,homes,war,acct:acct<1,total:Math.round((it+pt+wt)*100)/100}; }
function taxDay(){ const tx=TX(), w=taxWk(NOW); if(w===tx.w) return;
  const b=taxBill(tx,warYear(tx.w)); S.tx={w,inc:0,gain:0,sales:0};
  if(warYear(w)&&!SIM){ toast("⚔️ War year: a 2% war tax on your net worth comes due next tax day","bad"); }
  if(b.total<=0) return;
  bill("🧾 Taxes",b.total); S.st.taxes=(S.st.taxes||0)+b.total;
  const row=(l,v)=>`<div class="li"><span>${l}</span><b class="m dn">-${money(v)}</b></div>`;
  S.taxPend=`<p>It's tax day. Here's the bill for the week ("year") that just ended.</p>`+
    (b.it>0?row(`Income tax on ${money(b.base)} earned`,b.it):"")+
    (b.pt>0?row(`Property tax: ${b.homes.map(h=>h[2]).join(", ")}`,b.pt):"")+
    (b.wt>0?row("⚔️ War tax (2% of net worth over $1K)",b.wt):"")+
    `<div class="li"><b>Total</b><b class="m dn">-${money(b.total)}</b></div>`+
    (b.acct?`<p class="t">Your accountant saved you 15%.</p>`:"")+(inDebt()?`<p class="dn">You can't cover it all. Pay off the debt within 24 hours or you go broke.</p>`:""); }
function taxCard(){ const el=$("taxc"); if(!el) return; const tx=TX(), w=tx.w, b=taxBill(tx,warYear(w)), left=taxDayAt(w)-NOW;
  { const fs=$("fs-tax"); if(fs) fs.innerHTML=`in ${dur(left)} · <b class="dn">≈ -${money(b.total)}</b>`; }
  el.innerHTML=`<div class="row"><div class="g"><div class="b">🧾 Tax day in ${dur(left)}${warYear(w)?' <span class="pill bad">⚔️ War year</span>':''}</div>
   <div class="t">Earned this year: ${money(b.base)} · sales tax paid: ${money(tx.sales)}</div></div><b class="m dn">≈ -${money(b.total)}</b></div>
   <div class="t" style="margin-top:4px">Income tax ${money(b.it)}${b.pt?` · property ${money(b.pt)}`:""}${b.wt?` · war ${money(b.wt)}`:""} · ${(SALES_TAX*100).toFixed(1)}% sales tax on every stock buy and sell</div>`; }
function broke(why){

  S.cash=0; S.job=null; S.debtDue=0; S.liqPeak=0; S.st.broke++; AF().bk=1;
  for(const id in S.profs){ const s=S.profs[id]; S.profs[id]={own:0,br:{},fuel:0,momFix:0,rep:s.rep,sk:s.sk||0,up:{}}; }

  if(SIM) AWAY_BROKE=body; else { modal("💀 You went broke",body,[["Start over","gold"]]); build(); } }
function solvency(){

function buildStore(){
  let h=`<div class="pad"><div class="seg"><button data-seg="job" class="${seg==="job"?"on":""}">Profession</button><button data-seg="know" class="${seg==="know"?"on":""}">Knowledge</button><button data-seg="style" class="${seg==="style"?"on":""}">Style</button></div>`;
  if(seg==="style"){ setMain(h+styleHTML()+"</div>"); return; }
  if(seg==="know"){
    // Story-style progression: a banner with your overall progress, then each set of lessons as a timeline.
    // Learned = gold dot (tap to read it again), next to buy = pulsing dot + price button, later ones dimmed with a lock.
    // Unbought lessons still show nothing but a number and a price: buying reveals everything.
    const sets=[["📈 All stocks","The patterns every stock repeats.",KNOW,false],["🕰️ Longer charts","Slower trades for the 10m to 1D charts. Fewer chances, bigger swings.",LONG,false]]
      .concat(STOCKS.filter(unlocked).map(d=>[`${d.s} · ${d.n}`,`How ${d.s} moves, and when.`,SK.filter(k=>k.sym===d.s),true]));
    const all=sets.reduce((a,x)=>a.concat(x[2]),[]), got=all.filter(k=>S.know[k.id]).length;
    h+=`<div class="scene" style="height:165px">${KSCENE}<div class="scap"><div class="t" style="color:#cfd8e3">${got} of ${all.length} lessons learned</div><b>📘 Knowledge</b><div class="sd">Lessons are permanent, even if you go broke. Nothing on the chart changes; you just learn what to look for.</div><div class="pbar" style="margin-top:7px"><i style="width:${all.length?got/all.length*100:0}%;background:var(--gold)"></i></div></div></div>`;
    sets.forEach(([nm,sub,L,free])=>{ if(!L.length) return; const n=L.filter(k=>S.know[k.id]).length, nx=L.findIndex(k=>!S.know[k.id]);
      h+=`<h3>${nm} · ${n}/${L.length}</h3><div class="t" style="margin:-4px 3px 8px">${sub}</div><div class="tl">`;
      L.forEach((k,i)=>{ const own=S.know[k.id], open=free?!own:i===nx;
        if(own) h+=`<div class="tn done"><details class="kdet"><summary class="row"><div class="g"><b style="color:var(--text)">${k.n}</b>${k.ch?` <span class="pill">${k.ch}</span>`:""}</div><span class="t">Read ▾</span></summary>${lessonPic(k.id)}<div class="t" style="margin-top:6px">${kd(k)}</div></details></div>`;
        else h+=`<div class="tn ${open?"cur":""}"><div class="row"><div class="g"><b>Lesson ${i+1} · ???</b><div class="t">${open?"Buy it to find out what it teaches.":"🔒 Learn the one before it first."}</div></div>${open?`<button class="btn gold sm" data-kn="${k.id}" data-cost="${k.c}">${money(k.c)}</button>`:`<span class="t m">${money(k.c)}</span>`}</div></div>`; });
      h+=`</div>`; });
    const lk=STOCKS.filter(d=>!unlocked(d)&&!d.gone); if(lk.length) h+=`<div class="t" style="margin:8px 3px">🔒 ${SK.filter(k=>lk.some(d=>d.s===k.sym)).length} more lessons unlock as you unlock ${lk.map(d=>d.s).join(", ")}.</div>`;
    setMain(h+"</div>"); return; }
  const p=prof();
  if(p){ const s=pst(), t=tier();
    h+=`<div class="card"><div class="row"><div style="font-size:26px">${p.i}</div><div class="g"><div class="b">${p.n} <span class="pill">★ ${s.rep} rep · +${Math.round(Math.min(s.rep,200)*1.5)}% pay</span></div><div class="t">Pay multiplier ×${payMult(p.id).toFixed(2)} · every job you finish adds reputation</div></div></div></div><h3>Gear</h3>`;
    p.gear.forEach((g,i)=>{ if(i>s.own+2) return; const own=i<=s.own, br=own&&s.br[i];
      const r=br?`<button class="btn gold sm" data-rep="${i}" data-cost="${Math.max(3,GCOST[i]*.25)}">Fix ${money(Math.max(3,GCOST[i]*.25))}</button>`:own?`<span class="pill ${i===t?"ok":""}">${i===t?"In use":"Owned"}</span>`:i===s.own+1?`<button class="btn gold sm" data-gear="${i}" data-cost="${GCOST[i]}">${money(GCOST[i])}</button>`:`<span class="pill">🔒 ${money(GCOST[i])}</span>`;

  setMain(h+"</div>"); }
